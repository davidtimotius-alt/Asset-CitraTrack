<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Background Logo -->
  <rect width="512" height="512" rx="100" fill="#0f172a" />
  
  <!-- Pola Elemen QR Code (Aksen Background) -->
  <rect x="80" y="80" width="80" height="80" rx="16" fill="#2563eb" opacity="0.3" />
  <rect x="352" y="80" width="80" height="80" rx="16" fill="#2563eb" opacity="0.3" />
  <rect x="80" y="352" width="80" height="80" rx="16" fill="#2563eb" opacity="0.3" />
  
  <!-- Frame QR Scan / Target Tracking -->
  <path d="M 120 180 L 120 120 L 180 120" fill="none" stroke="#38bdf8" stroke-width="16" stroke-linecap="round" />
  <path d="M 332 120 L 392 120 L 392 180" fill="none" stroke="#38bdf8" stroke-width="16" stroke-linecap="round" />
  <path d="M 120 332 L 120 392 L 180 392" fill="none" stroke="#38bdf8" stroke-width="16" stroke-linecap="round" />
  <path d="M 332 392 L 392 392 L 392 332" fill="none" stroke="#38bdf8" stroke-width="16" stroke-linecap="round" />

  <!-- Ikon Citra / Lensa Kamera & QR Center -->
  <circle cx="256" cy="230" r="70" fill="#2563eb" />
  <circle cx="256" cy="230" r="50" fill="#0f172a" />
  <circle cx="256" cy="230" r="30" fill="#38bdf8" />
  <circle cx="270" cy="216" r="8" fill="#ffffff" />

  <!-- Garis Laser Laser Scanner -->
  <line x1="100" y1="230" x2="412" y2="230" stroke="#ef4444" stroke-width="6" stroke-dasharray="8 8" />

  <!-- Teks Brand CitraTrack -->
  <text x="256" y="440" font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-weight="800" font-size="42" fill="#ffffff" text-anchor="middle" letter-spacing="2">CITRATRACK</text>
  <text x="256" y="470" font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-weight="500" font-size="16" fill="#94a3b8" text-anchor="middle" letter-spacing="4">INVENTORY QR SYSTEM</text>
</svg>